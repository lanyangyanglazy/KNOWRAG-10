[project]
name = "langchain-rag-tutorial"
version = "0.1.0"
description = "LangChain RAG 教程 - 个人知识库问答"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # langchain 1.x 是 API 分水岭（分包架构、ChatPromptTemplate 元组语法等），
    # 故核心包锁定 >=1.0；加 <2 上限防止未来大版本破坏示例。
    "faiss-cpu>=1.0",
    "fastapi>=0.162.0",
    "itsdangerous>=2.2.0",
    "jieba>=0.42",
    "langchain>=1.0,<2",
    "langchain-community>=0.4,<1",
    "langchain-deepseek>=1.0,<2",
    "langchain-ollama>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2",
    "uvicorn>=0.54.0",
    "filetype>=1.2",
    "openpyxl>=3.1.5",
    "pgvector>=0.3.6",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pymupdf>=1.26",
    "pdfplumber>=0.11.4",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
# 让测试可以直接 import main / app（仓库根目录加入 sys.path）
pythonpath = ["."]
testpaths = ["tests"]
# tests/ 无 __init__.py 且 tests/ingest 是包：开启后按命名空间包解析，
# 避免 pytest 把 tests/ 插到 sys.path 首位、让 tests/ingest 顶替顶层 ingest 源包。
consider_namespace_packages = true
